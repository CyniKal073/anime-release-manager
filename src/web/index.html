<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动漫 Release 管理器</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <h1>动漫 Release 管理器</h1>
      <p class="sub">中文名 → nekoBT Release → qBittorrent</p>
    </div>
  </div>
  <div class="status" id="health"><span class="dot"></span><span class="txt">检查中…</span></div>
</header>

<main>
  <section class="card">
    <div class="search-row">
      <input id="q" type="search" placeholder="输入动漫名称，例如：葬送的芙莉莲" autocomplete="off">
      <button id="searchBtn" class="primary">搜索</button>
    </div>
    <p class="hint" id="searchHint">带季数后缀会自动剥离，例如「无职转生 第二季」按「无职转生」检索。</p>
  </section>

  <section class="card hidden" id="candidatesCard">
    <h2>作品候选 <span class="badge" id="candCount"></span></h2>
    <p class="hint">nekoBT 的媒体搜索是模糊匹配，similarity 之后的条目基本是噪声，请确认后再继续。</p>
    <div class="candidates" id="candidates"></div>
  </section>

  <section class="card hidden" id="filtersCard">
    <h2>筛选与排序</h2>
    <div class="filter-groups" id="filterGroups"></div>
    <div class="filter-extra">
      <label>合集
        <select id="batch">
          <option value="">不限</option>
          <option value="true">只要合集</option>
          <option value="false">只要单集</option>
        </select>
      </label>
      <label>最少做种
        <input id="minSeeders" type="number" min="0" step="1" placeholder="不限">
      </label>
      <label>排序
        <select id="sort">
          <option value="preference">按偏好打分</option>
          <option value="seeders">按做种数</option>
          <option value="size">按体积（小→大）</option>
        </select>
      </label>
      <label class="check">
        <input id="pausedAdd" type="checkbox"> 添加到客户端后暂停
      </label>
      <button id="resetFilters" class="ghost">清空筛选</button>
      <button id="savePrefs" class="ghost">存为默认偏好</button>
    </div>
  </section>

  <section class="card hidden" id="resultsCard">
    <h2>
      搜索结果
      <span class="badge" id="resultSummary"></span>
    </h2>
    <div class="tabs" id="tabs"></div>
    <div class="table-wrap">
      <table id="releases">
        <thead>
          <tr>
            <th style="width:38px">#</th>
            <th>标题</th>
            <th style="width:70px">分辨率</th>
            <th style="width:90px">来源</th>
            <th style="width:80px">编码</th>
            <th style="width:150px">字幕</th>
            <th style="width:90px">体积</th>
            <th style="width:60px">做种</th>
            <th style="width:80px">得分</th>
            <th style="width:90px">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card hidden" id="historyCard">
    <h2>下载历史 <button id="loadHistory" class="ghost small">刷新</button></h2>
    <div class="table-wrap">
      <table id="history">
        <thead>
          <tr><th>时间</th><th>标题</th><th>保存目录</th><th>状态</th><th>Hash</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toasts" class="toasts"></div>

<script src="/static/app.js?v=2"></script>
</body>
</html>
