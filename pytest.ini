[pytest]
testpaths = tests
# NOTE: keep this file ASCII-only. pytest reads it with the system locale
# encoding (GBK on this machine), so non-ASCII bytes break collection.
# anyio 3.5's pytest plugin is incompatible with the local pytest 7.1.2 and
# spins forever during startup; this project is pure sync code, so disable it.
addopts = -p no:anyio -q
