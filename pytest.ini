[pytest]
testpaths = tests
# NOTE: keep this file ASCII-only. pytest reads it with the system locale
# encoding (GBK on this machine), so non-ASCII bytes break collection.
#
# History: anyio 3.5 + pytest 7.1.2 deadlocked during collection. Fixed by
# upgrading to anyio 4.12.1 + pytest 8.4.2, so no plugin is disabled here.
addopts = -q
